<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sami &amp; Jenna: Ice Skating Adventure — Comic Page</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=swap">
  <style>
    :root {
      --bg: #201a22;
      --card: #2c2330;
      --ink: #3b2530;
      --gold: #ffe066;
      --text: #f5f2eb;
      --muted: #b8aeb4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, #3d2d3e 0%, var(--bg) 65%);
      color: var(--text);
      font-family: 'Fredoka', system-ui, sans-serif;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(32, 26, 34, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand strong { font-size: 18px; color: var(--gold); letter-spacing: 0.3px; }
    .brand span { font-size: 12.5px; color: var(--muted); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, .btn {
      font: 600 14px 'Fredoka', system-ui, sans-serif;
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s, background 0.12s, border-color 0.12s;
    }
    button:hover, .btn:hover { transform: translateY(-1px); border-color: var(--gold); }
    button.active {
      background: var(--gold);
      color: var(--ink);
      border-color: var(--gold);
    }
    main {
      max-width: 1440px;
      margin: 24px auto 48px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .sheet {
      flex: 1 1 540px;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .sheet.hidden { display: none; }
    .sheet-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold);
    }
    .page-frame {
      width: 100%;
      background: #fffdf7;
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .page-frame img, .page-frame canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    @media print {
      @page { size: letter portrait; margin: 0.25in; }
      body { background: #fff; }
      .toolbar, .sheet-label { display: none !important; }
      main { margin: 0; padding: 0; display: block; }
      .sheet { max-width: none; margin: 0; }
      .page-frame { box-shadow: none; border-radius: 0; }
      .page-frame img, .page-frame canvas { width: 100%; max-height: 10.5in; object-fit: contain; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <strong>Sami &amp; Jenna: Ice Skating Adventure</strong>
      <span>9-Panel Comic Page · Illustrated &amp; Studio Code-Rendered Editions</span>
    </div>
    <div class="controls">
      <button id="btn-illustrated" class="active" type="button">Illustrated Comic</button>
      <button id="btn-studio" type="button">Studio Code-Rendered</button>
      <button id="btn-both" type="button">Side by Side</button>
      <button id="btn-print" type="button">Print / Save PDF</button>
      <a class="btn" href="../../index.html">← Studio Home</a>
    </div>
  </header>

  <main>
    <section id="sheet-illustrated" class="sheet">
      <div class="sheet-label">Illustrated Storybook Edition</div>
      <div class="page-frame">
        <img id="illustrated-img" src="comic-illustrated.png" alt="Sami and Jenna Ice Skating Adventure illustrated comic page">
      </div>
    </section>

    <section id="sheet-studio" class="sheet hidden">
      <div class="sheet-label">Safadi Studio Code-Rendered Edition</div>
      <div class="page-frame">
        <canvas id="studio-canvas" width="1700" height="2200"></canvas>
      </div>
    </section>
  </main>

  <script>
    // Minimal globals expected by character rigs when loaded standalone outside studio.html
    window.CHARACTERS = window.CHARACTERS || {};
    window.FONT_TALK = '"Fredoka", "Comic Sans MS", sans-serif';
    window.FONT_SFX = '"Luckiest Guy", "Fredoka", Impact, sans-serif';
  </script>
  <script src="../../engine/core.js"></script>
  <script src="../../characters/sami/sami.js"></script>
  <script src="../../characters/jenna/jenna.js"></script>
  <script src="comic.js"></script>
  <script>
    const canvas = document.getElementById('studio-canvas');
    const sheetIll = document.getElementById('sheet-illustrated');
    const sheetStu = document.getElementById('sheet-studio');
    const btns = {
      illustrated: document.getElementById('btn-illustrated'),
      studio: document.getElementById('btn-studio'),
      both: document.getElementById('btn-both'),
    };

    function setMode(mode) {
      Object.entries(btns).forEach(([k, b]) => b.classList.toggle('active', k === mode));
      sheetIll.classList.toggle('hidden', mode === 'studio');
      sheetStu.classList.toggle('hidden', mode === 'illustrated');
    }

    btns.illustrated.onclick = () => setMode('illustrated');
    btns.studio.onclick = () => setMode('studio');
    btns.both.onclick = () => setMode('both');
    document.getElementById('btn-print').onclick = () => window.print();

    // Render once web fonts are ready
    (document.fonts?.ready || Promise.resolve()).then(() => {
      window.renderIceSkatingComic(canvas);
      window.COMIC_RENDERED = true;
    });
  </script>
</body>
</html>
